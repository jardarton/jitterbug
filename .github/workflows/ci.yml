# A small subset of `nix flake check`: the clang build with its tests, and
# the WebAssembly build with its tests under Node. The full check stays the
# local one (CONTRIBUTING.md). On main, the demo page is published too.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.9/install
      # Evaluating the flake overflows the runner's default stack.
      - run: |
          ulimit -s unlimited
          nix build -L --no-link .#checks.x86_64-linux.clang .#checks.x86_64-linux.wasm

  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.9/install
      - run: |
          ulimit -s unlimited
          nix build -L .#demo-web
          cp -rL result site
          chmod -R u+w site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
